<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PESONA Geotagging</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --primary: #0284c7; --primary-light: #38bdf8; --bg-color: #f1f5f9; --card-bg: #ffffff;
      --text-main: #0f172a; --text-muted: #64748b; --success: #059669; --success-bg: #d1fae5;
      --danger: #e11d48; --danger-bg: #ffe4e6; --border-color: #e2e8f0; --warning-bg: #fef3c7; --warning-text: #d97706;
    }
    body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-color); color: var(--text-main); padding-bottom: 40px; -webkit-tap-highlight-color: transparent;}
    
    /* Loading Overlay */
    #loaderOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: opacity 0.3s; }
    #loaderOverlay.active { visibility: visible; opacity: 1; }
    .spinner { width: 45px; height: 45px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { margin-top: 15px; font-weight: 700; color: var(--primary); font-size: 14px;}

    /* Header */
    .header { background: var(--card-bg); padding: 35px 20px 25px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: flex-start; position: sticky; top: 0; z-index: 50;}
    .header-text h1 { margin: 0; font-size: 24px; font-weight: 800; }
    .header-text p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); font-weight: 500;}
    .btn-sync { background: var(--bg-color); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;}

    /* Search & Filter Button */
    .search-wrapper { padding: 20px; background: var(--card-bg); border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; margin-bottom: 15px;}
    .search-box { position: relative; display: flex; align-items: center;}
    .search-box input { width: 100%; padding: 14px 50px 14px 45px; border: 1.5px solid var(--border-color); border-radius: 14px; font-family: inherit; font-size: 14px; outline: none; background: #f8fafc;}
    .search-box input:focus { border-color: var(--primary); background: #fff;}
    .search-icon { position: absolute; left: 15px; opacity: 0.5; font-size: 16px; }
    
    .filter-btn { position: absolute; right: 8px; background: #94a3b8; border: none; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: all 0.3s ease;}
    .filter-btn.active { background: var(--primary); box-shadow: 0 0 12px rgba(2, 132, 199, 0.4); }

    /* Indikator Filter Aktif */
    .filter-indicator { display: none; align-items: center; justify-content: space-between; margin-top: 12px; padding: 10px 14px; background: var(--warning-bg); border-radius: 10px; border: 1px solid rgba(217, 119, 6, 0.2);}
    .filter-indicator.show { display: flex; }
    .filter-indicator-text { font-size: 12px; font-weight: 700; color: var(--warning-text); display: flex; align-items: center; gap: 6px;}
    .reset-btn { background: #fff; color: var(--danger); border: 1px solid rgba(225, 29, 72, 0.3); padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: background 0.2s;}
    .reset-btn:active { background: var(--danger-bg); }

    /* Filter Modal (Bottom Sheet) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; visibility: hidden; opacity: 0; transition: opacity 0.3s; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-content { position: absolute; bottom: -100%; left: 0; width: 100%; background: #fff; padding: 25px 25px 40px; box-sizing: border-box; border-top-left-radius: 25px; border-top-right-radius: 25px; transition: bottom 0.3s ease-out; }
    .modal-overlay.active .modal-content { bottom: 0; }
    .modal-title { font-size: 18px; font-weight: 800; margin: 0 0 20px; display: flex; justify-content: space-between;}
    .close-modal { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer;}
    .filter-group { margin-bottom: 20px; }
    .filter-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;}
    .filter-group select { width: 100%; padding: 14px; border: 1.5px solid var(--border-color); border-radius: 12px; font-family: inherit; font-size: 14px; background: #f8fafc; outline: none; }
    .filter-group select:focus { border-color: var(--primary); }

    /* Patient Card */
    .list-container { padding: 0 20px; }
    .patient-card { background: var(--card-bg); border-radius: 16px; padding: 18px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; border: 1px solid rgba(226, 232, 240, 0.8); transition: transform 0.2s;}
    .patient-card:active { transform: scale(0.98); background: #f8fafc;}
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .p-name { margin: 0; font-size: 16px; font-weight: 700; }
    .p-nik { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 600;}
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 5px;}
    .p-address { margin: 0; font-size: 13px; color: var(--text-muted); font-weight: 500; display: flex; align-items: flex-start; gap: 6px; flex: 1; line-height: 1.4;}
    .pin-icon { flex-shrink: 0; width: 16px; height: 16px; fill: var(--primary-light); margin-top: 1px;}
    .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    .badge-done { background: var(--success-bg); color: var(--success); border: 1px solid rgba(5, 150, 105, 0.1);}
    .badge-pending { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(225, 29, 72, 0.1);}

    /* Form & Map */
    #formView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; overflow-y: auto; padding: 0; }
    .form-header { padding: 25px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px;}
    .nav-back { background: var(--bg-color); border: none; border-radius: 12px; width: 42px; height: 42px; font-size: 20px; cursor: pointer; }
    .form-header h2 { margin: 0; font-size: 18px; font-weight: 800;}
    .form-content { padding: 20px; }
    #map { height: 260px; width: 100%; border-radius: 16px; margin-bottom: 12px; border: 2px solid #fff; z-index: 1;}
    .map-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 25px; font-weight: 500;}
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;}
    .input-group input { width: 100%; padding: 16px; border: 1.5px solid var(--border-color); border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 600; box-sizing: border-box; background: var(--card-bg); outline: none;}
    .btn { width: 100%; padding: 18px; border: none; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 12px;}
    .btn-gps { background: #e0f2fe; color: var(--primary); border: 1px solid #bae6fd;}
    .btn-submit { background: var(--primary); color: white; }
    
    #sysStatus { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 8px 18px; font-size: 11px; font-weight: 700; color: white; background: rgba(5, 150, 105, 0.95); border-radius: 20px; z-index: 2000; backdrop-filter: blur(4px);}
    #sysStatus.offline { background: rgba(225, 29, 72, 0.95); }
  </style>
</head>
<body>

<div id="loaderOverlay"><div class="spinner"></div><div class="loader-text" id="loaderText">Menyinkronkan Data...</div></div>
<div id="sysStatus">SISTEM ONLINE</div>

<!-- TAMPILAN DAFTAR -->
<div id="listView">
  <div class="header">
    <div class="header-text"><h1>PESONA</h1><p>Puskesmas Klungkung I</p></div>
    <button class="btn-sync" onclick="fetchDataPasien()">🔄 Segarkan</button>
  </div>
  
  <div class="search-wrapper">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari nama atau NIK pasien..." onkeyup="applyFilters()">
      <button id="filterBtnIcon" class="filter-btn" onclick="toggleFilter()" title="Filter Data">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
      </button>
    </div>
    
    <!-- Indikator Filter Muncul Disini -->
    <div id="filterIndicator" class="filter-indicator">
      <div class="filter-indicator-text"><span>⚙️</span> Data sedang difilter</div>
      <button class="reset-btn" onclick="resetFilters()">Reset Filter</button>
    </div>
  </div>

  <div id="patientList" class="list-container"></div>
</div>

<!-- FILTER MODAL -->
<div id="filterModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title"><span>⚙️ Filter Spesifik</span><button class="close-modal" onclick="toggleFilter()">✕</button></div>
    
    <div class="filter-group">
      <label>Status Geotagging</label>
      <select id="filterStatus" onchange="applyFilters()">
        <option value="all">Semua Status</option>
        <option value="sudah">Sudah Ditandai (Memiliki Koordinat)</option>
        <option value="belum">Belum Ditandai</option>
      </select>
    </div>

    <!-- Pilihan Wilayah Dipatenkan Berdasarkan Area Puskesmas -->
    <div class="filter-group">
      <label>Wilayah / Desa</label>
      <select id="filterAlamat" onchange="applyFilters()">
        <option value="all">Semua Wilayah</option>
        <option value="satra">Satra</option>
        <option value="kamasan">Kamasan</option>
        <option value="semarapura kauh">Semarapura Kauh</option>
        <option value="gelgel">Gelgel</option>
        <option value="tojan">Tojan</option>
        <option value="tangkas">Tangkas</option>
        <option value="semarapura klod">Semarapura Klod</option>
        <option value="semarapura klod kangin">Semarapura Klod Kangin</option>
        <option value="kampung gelgel">Kampung Gelgel</option>
      </select>
    </div>

    <button class="btn btn-submit" onclick="toggleFilter()">Terapkan & Tutup</button>
  </div>
</div>

<!-- TAMPILAN FORM -->
<div id="formView">
  <div class="form-header"><button class="nav-back" onclick="tutupForm()">←</button><h2 id="subtitleNama">Nama</h2></div>
  <div class="form-content">
    <form id="formGeo">
      <input type="hidden" id="kategori" value="HT">
      <div id="map"></div>
      <div class="map-hint">💡 Geser pin biru untuk menandai rumah secara akurat.</div>
      <div class="input-group"><label>Koordinat</label><input type="text" id="koordinat" placeholder="Belum ada koordinat" readonly required></div>
      <div class="input-group"><label>NIK</label><input type="text" id="nik" readonly></div>
      <button type="button" class="btn btn-gps" onclick="getGPS()">📍 Cari Otomatis Via Satelit GPS</button>
      <button type="submit" class="btn btn-submit">Simpan & Sinkronkan</button>
    </form>
  </div>
</div>

<script>
  // === GANTI DENGAN LINK WEB APP GAS ANDA ===
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzcp57xHiOczZayb9wpQwDNkAuBiJpGPGHsfuaxpB4CxyaPzsfTN2fU9VpECskx49lE/exec"; 
  
  let db; let dataPasienLokal = []; let map, marker;

  function showLoader(text) { document.getElementById('loaderText').innerText = text; document.getElementById('loaderOverlay').classList.add('active'); }
  function hideLoader() { document.getElementById('loaderOverlay').classList.remove('active'); }

  function toggleFilter() {
    const modal = document.getElementById('filterModal');
    modal.classList.toggle('active');
  }

  // Fungsi Reset Semua Filter ke Bawaan
  function resetFilters() {
    document.getElementById('searchInput').value = "";
    document.getElementById('filterStatus').value = "all";
    document.getElementById('filterAlamat').value = "all";
    applyFilters();
  }

  const request = indexedDB.open("DatabasePESONA", 1);
  request.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("dataTunda", { autoIncrement: true }); };
  request.onsuccess = (e) => { db = e.target.result; if (navigator.onLine) sinkronisasiDataTunda(); };

  window.onload = () => {
    const cachedData = localStorage.getItem('pesona_data_v7');
    if (cachedData) { dataPasienLokal = JSON.parse(cachedData); applyFilters(); }
    if (navigator.onLine) fetchDataPasien();
  };

  async function fetchDataPasien() {
    showLoader("Mengambil data terbaru...");
    try {
      const response = await fetch(GAS_URL);
      const data = await response.json();
      dataPasienLokal = data;
      localStorage.setItem('pesona_data_v7', JSON.stringify(data));
      applyFilters(); 
    } catch(e) { 
      console.log("Mode offline aktif atau terjadi kendala tautan", e);
      applyFilters(); 
    } finally { 
      hideLoader(); 
    }
  }

  function applyFilters() {
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;
    const alamatFilter = document.getElementById('filterAlamat').value;

    // Deteksi apakah sedang ada filter yang berjalan
    const isFilterActive = (keyword !== '' || statusFilter !== 'all' || alamatFilter !== 'all');
    
    // Tampilkan atau sembunyikan indikator filter UI
    const indicator = document.getElementById('filterIndicator');
    const filterBtnIcon = document.getElementById('filterBtnIcon');
    if (isFilterActive) {
      indicator.classList.add('show');
      filterBtnIcon.classList.add('active');
    } else {
      indicator.classList.remove('show');
      filterBtnIcon.classList.remove('active');
    }

    const filteredData = dataPasienLokal.filter(p => {
      const isSelesai = p.status.toLowerCase().includes("sudah");
      const matchKeyword = p.nama.toLowerCase().includes(keyword) || (p.nik && p.nik.toLowerCase().includes(keyword));
      
      let matchStatus = true;
      if (statusFilter === 'sudah') matchStatus = isSelesai;
      if (statusFilter === 'belum') matchStatus = !isSelesai;

      // Logika Pencarian Alamat Menggunakan 'includes' agar variasi seperti "Br. Tangkas, Gelgel" tetap terbaca sebagai "Gelgel"
      let matchAlamat = true;
      if (alamatFilter !== 'all') {
         const alamatDatabase = p.alamat ? p.alamat.toLowerCase() : "";
         matchAlamat = alamatDatabase.includes(alamatFilter);
      }

      return matchKeyword && matchStatus && matchAlamat;
    });

    renderList(filteredData, isFilterActive);
  }

  function renderList(data, isFilterActive) {
    const container = document.getElementById('patientList');
    container.innerHTML = "";
    
    if(data.length === 0) { 
      // Teks cerdas: membedakan antara data kosong murni vs data kosong karena difilter
      const emptyMessage = isFilterActive 
        ? "Tidak ada data yang cocok dengan filter. Silakan ubah atau Reset Filter." 
        : "Belum ada data pasien dari database.";
        
      container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8; font-weight:600; line-height: 1.5;">${emptyMessage}</div>`; 
      return; 
    }

    const svgPin = `<svg class="pin-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;

    data.forEach(p => {
      const isSelesai = p.status.toLowerCase().includes("sudah");
      const badgeClass = isSelesai ? "badge-done" : "badge-pending";
      const badgeText = isSelesai ? "Sudah Ditandai" : "Belum Ditandai";
      const alamat = p.alamat || "Alamat tidak tercatat";

      const item = document.createElement('div');
      item.className = `patient-card`;
      item.onclick = () => bukaForm(p.nama, p.nik, p.koordinat);
      item.innerHTML = `
        <div class="card-top"><div><h3 class="p-name">${p.nama}</h3><div class="p-nik">NIK: ${p.nik}</div></div></div>
        <div class="card-bottom">
          <p class="p-address">${svgPin} <span>${alamat}</span></p>
          <span class="status-badge ${badgeClass}">${badgeText}</span>
        </div>
      `;
      container.appendChild(item);
    });
  }

  function inisialisasiPeta(savedKoordinat) {
    let lat = -8.5333; let lng = 115.4000; let zoomLvl = 13;
    if (savedKoordinat && savedKoordinat.includes(",")) {
       const parts = savedKoordinat.split(',');
       lat = parseFloat(parts[0].trim()); lng = parseFloat(parts[1].trim());
       zoomLvl = 17; 
    }

    if (!map) {
      map = L.map('map').setView([lat, lng], zoomLvl);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
      marker = L.marker([lat, lng], {draggable: true}).addTo(map);
      marker.on('dragend', function(e) { const pos = marker.getLatLng(); document.getElementById('koordinat').value = `${pos.lat}, ${pos.lng}`; });
      map.on('click', function(e) { marker.setLatLng(e.latlng); document.getElementById('koordinat').value = `${e.latlng.lat}, ${e.latlng.lng}`; });
    } else {
      map.setView([lat, lng], zoomLvl);
      marker.setLatLng([lat, lng]);
    }
    setTimeout(() => { map.invalidateSize(); }, 300);
  }

  function bukaForm(nama, nik, koordinat) {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
    document.getElementById('subtitleNama').innerText = nama;
    document.getElementById('nik').value = nik;
    document.getElementById('koordinat').value = koordinat || "";
    inisialisasiPeta(koordinat);
  }

  function tutupForm() { document.getElementById('listView').style.display = 'block'; document.getElementById('formView').style.display = 'none'; }

  function getGPS() {
    if (navigator.geolocation) {
      showLoader("Mencari lokasi satelit...");
      navigator.geolocation.getCurrentPosition(
        pos => {
          hideLoader();
          const lat = pos.coords.latitude; const lng = pos.coords.longitude;
          document.getElementById('koordinat').value = `${lat}, ${lng}`;
          if(map && marker) { map.setView([lat, lng], 17); marker.setLatLng([lat, lng]); }
        },
        err => { hideLoader(); alert("Gagal ambil lokasi. Pastikan GPS HP menyala."); },
        { enableHighAccuracy: true }
      );
    }
  }

  document.getElementById('formGeo').addEventListener('submit', (e) => {
    e.preventDefault();
    const data = { kategori: document.getElementById('kategori').value, nik: document.getElementById('nik').value, koordinat: document.getElementById('koordinat').value };
    showLoader("Menyimpan & Sinkronisasi...");
    if (navigator.onLine) {
      fetch(GAS_URL, { method: "POST", body: JSON.stringify(data), mode: 'no-cors' })
        .then(() => { alert("Data berhasil masuk ke Database!"); fetchDataPasien(); tutupForm(); })
        .catch(() => { simpanOffline(data); })
        .finally(() => { hideLoader(); });
    } else { simpanOffline(data); hideLoader(); }
  });

  function simpanOffline(data) { const tx = db.transaction("dataTunda", "readwrite"); tx.objectStore("dataTunda").add(data); alert("Koneksi terputus! Data disimpan di HP."); tutupForm(); }

  function sinkronisasiDataTunda() {
    const store = db.transaction("dataTunda", "readwrite").objectStore("dataTunda");
    store.getAll().onsuccess = (e) => {
      const dataNyangkut = e.target.result;
      if (dataNyangkut.length > 0) {
        showLoader(`Menyinkronkan ${dataNyangkut.length} data tertunda...`);
        dataNyangkut.forEach((data, i) => { fetch(GAS_URL, { method: "POST", body: JSON.stringify(data), mode: 'no-cors' }).then(() => db.transaction("dataTunda", "readwrite").objectStore("dataTunda").delete(store.getAllKeys().result[i])); });
        setTimeout(() => { fetchDataPasien(); hideLoader(); }, 3000);
      }
    };
  }

  window.addEventListener('online', () => { document.getElementById('sysStatus').innerText = "SISTEM ONLINE"; document.getElementById('sysStatus').className = ""; sinkronisasiDataTunda(); });
  window.addEventListener('offline', () => { document.getElementById('sysStatus').innerText = "MODE OFFLINE"; document.getElementById('sysStatus').className = "offline"; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
