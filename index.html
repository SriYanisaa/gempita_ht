<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PESONA Geotagging</title>
  <link rel="manifest" href="manifest.json">
  <!-- Menggunakan Font Modern Google -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #818CF8;
      --bg-color: #F3F4F6;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --success: #10B981;
      --success-bg: #D1FAE5;
      --danger: #EF4444;
      --danger-bg: #FEE2E2;
    }

    body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg-color); padding-bottom: 80px; color: var(--text-main); }
    
    /* Header Elegan dengan Gradien */
    .header { background: linear-gradient(135deg, var(--primary), #6366F1); padding: 25px 20px 30px; color: white; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); position: relative;}
    .header h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; font-weight: 400; }
    .sync-btn { position: absolute; right: 20px; top: 30px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(5px); font-size: 14px;}

    /* Kotak Pencarian Mengambang */
    .search-wrapper { padding: 0 20px; margin-top: -25px; position: relative; z-index: 10; }
    .search-input { width: 100%; padding: 15px 20px; border: none; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box; outline: none; transition: box-shadow 0.3s; }
    .search-input:focus { box-shadow: 0 4px 15px rgba(79, 70, 229, 0.2); }

    /* Daftar Pasien yang Estetik */
    .list-container { padding: 20px; }
    .patient-card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: space-between; transition: transform 0.2s; cursor: pointer; border-left: 4px solid transparent; }
    .patient-card:active { transform: scale(0.98); }
    .patient-card.done { border-left-color: var(--success); }
    .patient-card.pending { border-left-color: var(--danger); }
    
    .patient-info { flex: 1; }
    .p-name { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; color: var(--text-main); }
    .p-address { margin: 0; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    
    /* Status Badge di Pojok */
    .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; white-space: nowrap; }
    .badge-done { background: var(--success-bg); color: var(--success); }
    .badge-pending { background: var(--danger-bg); color: var(--danger); }

    /* Desain Form (Overlay) */
    #formView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; overflow-y: auto; box-sizing: border-box; padding: 25px; }
    .nav-back { background: none; border: none; font-size: 16px; font-weight: 600; color: var(--text-muted); cursor: pointer; padding: 0; display: flex; align-items: center; gap: 8px; margin-bottom: 25px; font-family: 'Poppins', sans-serif;}
    .form-title { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 5px; margin-top: 0; }
    .form-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; }
    
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
    .input-group input { width: 100%; padding: 15px; border: 1px solid #E5E7EB; border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box; background: #F9FAFB; color: var(--text-muted); }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn-gps { background: #E0E7FF; color: var(--primary); margin-bottom: 15px; }
    .btn-submit { background: linear-gradient(135deg, var(--primary), #6366F1); color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); }

    /* Indikator Status Sistem */
    #sysStatus { position: fixed; bottom: 0; left: 0; width: 100%; text-align: center; padding: 10px; font-size: 12px; font-weight: 500; color: white; background: var(--success); z-index: 2000; transition: background 0.3s; }
    #sysStatus.offline { background: var(--danger); }
  </style>
</head>
<body>

<!-- Indikator Jaringan -->
<div id="sysStatus">Online (Sinkronisasi Aktif)</div>

<!-- TAMPILAN 1: DAFTAR PASIEN -->
<div id="listView">
  <div class="header">
    <h1>PESONA Kohort</h1>
    <p>Puskesmas Klungkung I</p>
    <button class="sync-btn" onclick="fetchDataPasien()">🔄 Segarkan</button>
  </div>
  
  <div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari nama pasien..." onkeyup="filterPencarian()">
  </div>

  <div id="patientList" class="list-container">
    <div style="text-align:center; padding:30px; color:#9CA3AF; font-size: 14px;">Memuat data pasien...</div>
  </div>
</div>

<!-- TAMPILAN 2: FORM INPUT -->
<div id="formView">
  <button class="nav-back" onclick="tutupForm()">← Kembali</button>
  
  <h2 class="form-title">Geotagging</h2>
  <div class="form-subtitle" id="subtitleNama">Nama Pasien</div>
  
  <form id="formGeo">
    <input type="hidden" id="kategori" value="HT">
    
    <div class="input-group">
      <label>Nomor Induk Kependudukan (NIK)</label>
      <input type="text" id="nik" readonly>
    </div>

    <div class="input-group">
      <label>Titik Koordinat Geografis</label>
      <input type="text" id="koordinat" placeholder="Belum ada koordinat" readonly required>
    </div>

    <button type="button" class="btn btn-gps" onclick="getGPS()">📍 Ambil Lokasi Saat Ini</button>
    <button type="submit" class="btn btn-submit">Simpan & Sinkronkan</button>
  </form>
</div>

<script>
  // === MASUKKAN URL DEPLOYMENT BARU ANDA DI SINI ===
  const GAS_URL = "https://script.google.com/macros/library/d/1gHmLM5ZeRqsOTyI8wC1gcXUQGqMyICjAb2xciueN05NLkUuH1T2gBUH5/5"; 
  let db;
  let dataPasienLokal = [];

  // Inisialisasi IndexedDB
  const request = indexedDB.open("DatabasePESONA", 1);
  request.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("dataTunda", { autoIncrement: true }); };
  request.onsuccess = (e) => { db = e.target.result; if (navigator.onLine) sinkronisasiDataTunda(); };

  window.onload = () => {
    const cachedData = localStorage.getItem('pesona_data_v2');
    if (cachedData) { dataPasienLokal = JSON.parse(cachedData); renderList(dataPasienLokal); }
    if (navigator.onLine) fetchDataPasien();
  };

  async function fetchDataPasien() {
    try {
      const response = await fetch(GAS_URL);
      const data = await response.json();
      dataPasienLokal = data;
      localStorage.setItem('pesona_data_v2', JSON.stringify(data));
      renderList(dataPasienLokal);
    } catch(e) { console.log("Offline mode aktif"); }
  }

  function renderList(data) {
    const container = document.getElementById('patientList');
    container.innerHTML = "";
    
    data.forEach(p => {
      const isSelesai = p.status.toLowerCase().includes("sudah");
      const cardClass = isSelesai ? "done" : "pending";
      const badgeClass = isSelesai ? "badge-done" : "badge-pending";
      const badgeText = isSelesai ? "Selesai" : "Belum";

      // Desain Kartu dengan Nama, Alamat di bawahnya, dan Status di pojok
      const item = document.createElement('div');
      item.className = `patient-card ${cardClass}`;
      item.onclick = () => bukaForm(p.nama, p.nik);
      item.innerHTML = `
        <div class="patient-info">
          <h3 class="p-name">${p.nama}</h3>
          <p class="p-address">📍 ${p.alamat}</p>
        </div>
        <div>
          <span class="status-badge ${badgeClass}">${badgeText}</span>
        </div>
      `;
      container.appendChild(item);
    });
  }

  function filterPencarian() {
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    renderList(dataPasienLokal.filter(p => p.nama.toLowerCase().includes(keyword)));
  }

  function bukaForm(nama, nik) {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
    document.getElementById('subtitleNama').innerText = "Pasien: " + nama;
    document.getElementById('nik').value = nik;
    document.getElementById('koordinat').value = "";
    window.scrollTo(0, 0);
  }

  function tutupForm() {
    document.getElementById('listView').style.display = 'block';
    document.getElementById('formView').style.display = 'none';
  }

  function getGPS() {
    if (navigator.geolocation) {
      document.getElementById('koordinat').value = "Mencari akurasi...";
      navigator.geolocation.getCurrentPosition(
        pos => document.getElementById('koordinat').value = `${pos.coords.latitude}, ${pos.coords.longitude}`,
        err => alert("Gagal mengambil GPS. Pastikan izin lokasi HP aktif."),
        { enableHighAccuracy: true }
      );
    }
  }

  document.getElementById('formGeo').addEventListener('submit', (e) => {
    e.preventDefault();
    const data = {
      kategori: document.getElementById('kategori').value,
      nik: document.getElementById('nik').value,
      koordinat: document.getElementById('koordinat').value
    };

    const btnSubmit = document.querySelector('.btn-submit');
    btnSubmit.innerText = "Menyimpan...";

    if (navigator.onLine) {
      fetch(GAS_URL, { method: "POST", body: JSON.stringify(data), mode: 'no-cors' })
        .then(() => {
          alert("Koordinat Berhasil Disimpan!");
          fetchDataPasien(); 
          tutupForm();
          btnSubmit.innerText = "Simpan & Sinkronkan";
        }).catch(() => { simpanOffline(data); btnSubmit.innerText = "Simpan & Sinkronkan"; });
    } else {
      simpanOffline(data);
      btnSubmit.innerText = "Simpan & Sinkronkan";
    }
  });

  function simpanOffline(data) {
    const tx = db.transaction("dataTunda", "readwrite");
    tx.objectStore("dataTunda").add(data);
    alert("Anda sedang offline. Data disimpan di HP dan akan dikirim otomatis saat ada sinyal.");
    tutupForm();
  }

  function sinkronisasiDataTunda() {
    const store = db.transaction("dataTunda", "readwrite").objectStore("dataTunda");
    store.getAll().onsuccess = (e) => {
      const dataNyangkut = e.target.result;
      if (dataNyangkut.length > 0) {
        document.getElementById('sysStatus').innerText = `Menyinkronkan ${dataNyangkut.length} data...`;
        dataNyangkut.forEach((data, i) => {
          fetch(GAS_URL, { method: "POST", body: JSON.stringify(data), mode: 'no-cors' })
            .then(() => db.transaction("dataTunda", "readwrite").objectStore("dataTunda").delete(store.getAllKeys().result[i]));
        });
        setTimeout(() => { 
          fetchDataPasien(); 
          document.getElementById('sysStatus').innerText = "Online (Sinkronisasi Aktif)";
        }, 3000);
      }
    };
  }

  window.addEventListener('online', () => {
    const sys = document.getElementById('sysStatus');
    sys.innerText = "Online (Sinkronisasi Aktif)";
    sys.className = "";
    sinkronisasiDataTunda();
  });
  window.addEventListener('offline', () => {
    const sys = document.getElementById('sysStatus');
    sys.innerText = "Mode Lapangan (Offline)";
    sys.className = "offline";
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
