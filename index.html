<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- KTP Khusus untuk iPhone / Apple (Anti-Cache v3) -->
  <title>PANDU</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PANDU">
  <link rel="apple-touch-icon" href="logo_transparent.png?v=3">
  
  <link rel="manifest" href="manifest_pandu.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --primary: #14b8a6; 
      --primary-dark: #0f766e;
      --accent-navy: #0f172a; 
      --header-bg: #030712; 
      --bg-color: #f1f5f9; 
      --card-bg: #ffffff; 
      --text-main: #0f172a; 
      --text-muted: #64748b; 
      --success: #059669; 
      --success-bg: #d1fae5;
      --danger: #e11d48; 
      --danger-bg: #ffe4e6;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
      --warning-bg: #fef3c7; 
      --warning-text: #d97706;
    }
    
    body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-color); color: var(--text-main); padding-bottom: 40px; -webkit-tap-highlight-color: transparent;}
    
    /* ========================================= */
    /* DESAIN SPLASH SCREEN NATIVE (BARU)        */
    /* ========================================= */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--header-bg); /* Latar gelap menyesuaikan header */
      z-index: 999999; /* Paling depan */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
    }
    #splashScreen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .splash-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7);
      animation: pulseSplash 1.8s infinite;
      margin-bottom: 25px;
    }
    .splash-title {
      color: var(--primary);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0;
    }
    .splash-subtitle {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
    }
    @keyframes pulseSplash {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(20, 184, 166, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); }
    }
    /* ========================================= */

    #loaderOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: opacity 0.3s; }
    #loaderOverlay.active { visibility: visible; opacity: 1; }
    .spinner { width: 45px; height: 45px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { margin-top: 15px; font-weight: 700; color: var(--primary-dark); font-size: 14px; letter-spacing: 0.5px;}

    .header { background: var(--header-bg); padding: 35px 20px 45px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.15);}
    .header-text h1 { margin: 0; font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: 1px;}
    .header-text p { margin: 4px 0 0; font-size: 12px; color: #94a3b8; font-weight: 500;}
    .btn-sync { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: background 0.2s;}
    .btn-sync:active { background: rgba(255, 255, 255, 0.2); }

    .search-wrapper { padding: 0 20px; margin-top: -25px; position: relative; z-index: 20; margin-bottom: 25px;}
    .search-box { position: relative; display: flex; align-items: center; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);}
    .search-box input { width: 100%; padding: 16px 50px 16px 45px; border: 2px solid transparent; border-radius: 16px; font-family: inherit; font-size: 14px; outline: none; background: transparent; color: var(--text-main); transition: border-color 0.3s;}
    .search-box input::placeholder { color: #94a3b8; }
    .search-box input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 15px; color: #94a3b8; font-size: 16px; }
    
    .filter-btn { position: absolute; right: 8px; background: var(--input-bg); border: 1px solid var(--border-color); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: all 0.3s ease;}
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3); }

    .filter-indicator { display: none; align-items: center; justify-content: space-between; margin-top: 12px; padding: 12px 16px; background: var(--warning-bg); border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.3); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.05);}
    .filter-indicator.show { display: flex; }
    .filter-indicator-text { font-size: 12px; font-weight: 700; color: var(--warning-text); display: flex; align-items: center; gap: 6px;}
    .reset-btn { background: #ffffff; color: var(--danger); border: 1px solid rgba(225, 29, 72, 0.2); padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: background 0.2s;}
    .reset-btn:active { background: var(--danger-bg); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 2000; visibility: hidden; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(3px);}
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-content { position: absolute; bottom: -100%; left: 0; width: 100%; background: var(--card-bg); padding: 25px 25px 40px; box-sizing: border-box; border-top-left-radius: 25px; border-top-right-radius: 25px; transition: bottom 0.3s ease-out; box-shadow: 0 -10px 30px rgba(0,0,0,0.1);}
    .modal-overlay.active .modal-content { bottom: 0; }
    .modal-title { font-size: 18px; font-weight: 800; margin: 0 0 20px; display: flex; justify-content: space-between; color: var(--accent-navy);}
    .close-modal { background: var(--input-bg); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;}
    .filter-group { margin-bottom: 20px; }
    .filter-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
    .filter-group select { width: 100%; padding: 14px; border: 1.5px solid var(--border-color); border-radius: 12px; font-family: inherit; font-size: 14px; background: var(--input-bg); color: var(--text-main); font-weight: 600; outline: none; appearance: none;}
    .filter-group select:focus { border-color: var(--primary); background: #ffffff;}

    .list-container { padding: 0 20px; }
    .patient-card { background: var(--card-bg); border-radius: 16px; padding: 18px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: transform 0.2s, box-shadow 0.2s;}
    .patient-card:active { transform: scale(0.98); background: var(--input-bg);}
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .p-name { margin: 0; font-size: 16px; font-weight: 800; color: var(--accent-navy);}
    .p-nik { font-size: 11px; color: var(--primary-dark); margin-top: 4px; font-weight: 700; letter-spacing: 0.5px;}
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 5px;}
    .p-address { margin: 0; font-size: 13px; color: var(--text-muted); font-weight: 500; display: flex; align-items: flex-start; gap: 6px; flex: 1; line-height: 1.4;}
    .pin-icon { flex-shrink: 0; width: 16px; height: 16px; fill: var(--primary); margin-top: 1px;}
    .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    .badge-done { background: var(--success-bg); color: var(--success); border: 1px solid rgba(5, 150, 105, 0.2);}
    .badge-pending { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(225, 29, 72, 0.2);}

    #formView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); z-index: 1000; overflow-y: auto; padding: 0; }
    .form-header { padding: 25px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px;}
    .nav-back { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 42px; height: 42px; font-size: 20px; color: var(--text-main); cursor: pointer; transition: background 0.2s;}
    .nav-back:active { background: var(--border-color); }
    .form-header h2 { margin: 0; font-size: 18px; font-weight: 800; color: var(--accent-navy);}
    .form-content { padding: 20px; background: var(--bg-color); min-height: 100vh;}
    
    #map { height: 260px; width: 100%; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border-color); z-index: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.05);}
    .map-hint { font-size: 12px; color: var(--primary-dark); text-align: center; margin-bottom: 25px; font-weight: 600;}
    
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
    .input-group input { width: 100%; padding: 16px; border: 1.5px solid var(--border-color); border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 600; box-sizing: border-box; background: var(--card-bg); color: var(--text-main); outline: none; transition: border-color 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.02);}
    .input-group input:focus { border-color: var(--primary); }
    
    .btn { width: 100%; padding: 18px; border: none; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 12px; transition: transform 0.2s, box-shadow 0.2s;}
    .btn:active { transform: translateY(2px); }
    .btn-gps { background: #ccfbf1; color: var(--primary-dark); border: 1px solid rgba(20, 184, 166, 0.3);}
    .btn-submit { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 8px 20px rgba(20, 184, 166, 0.25);}
    
    #sysStatus { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 8px 18px; font-size: 11px; font-weight: 700; color: white; background: rgba(5, 150, 105, 0.95); border-radius: 20px; z-index: 2000; backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0,0,0,0.15);}
    #sysStatus.offline { background: rgba(225, 29, 72, 0.95); }
    
    .watermark-it {
      position: fixed;
      bottom: 45px; /* Posisinya pas di atas tombol status online/offline */
      right: 20px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      opacity: 0.6; /* Dibuat agak transparan */
      z-index: 1500;
      letter-spacing: 0.5px;
      pointer-events: none; /* Agar tidak menghalangi jika tidak sengaja terklik */
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splashScreen">
  <img src="logo_transparent.png?v=3" alt="Logo PANDU" class="splash-logo">
  <h1 class="splash-title">PANDU</h1>
  <div class="splash-subtitle">Puskesmas Klungkung I</div>
</div>

<div id="loaderOverlay"><div class="spinner"></div><div class="loader-text" id="loaderText">Menyinkronkan Data...</div></div>
<div id="sysStatus">SISTEM ONLINE</div>

<!-- TAMPILAN DAFTAR -->
<div id="listView">
  <div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
      <img src="logo_transparent.png?v=3" alt="Logo PANDU" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 15px rgba(20, 184, 166, 0.3);">
      <div class="header-text">
        <h1>PANDU</h1>
        <p>Aplikasi Pemetaan Kesehatan Masyarakat</p>
      </div>
    </div>
    <button class="btn-sync" onclick="fetchDataPasien()">🔄 Segarkan</button>
  </div>
  
  <div class="search-wrapper">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari nama atau NIK pasien..." onkeyup="applyFilters()">
      <button id="filterBtnIcon" class="filter-btn" onclick="toggleFilter()" title="Filter Data">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
      </button>
    </div>
    
    <div id="filterIndicator" class="filter-indicator">
      <div class="filter-indicator-text"><span>⚙️</span> Data sedang difilter</div>
      <button class="reset-btn" onclick="resetFilters()">Reset Filter</button>
    </div>
  </div>

  <div id="patientList" class="list-container"></div>
</div>

<!-- FILTER MODAL -->
<div id="filterModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title"><span>⚙️ Filter Spesifik</span><button class="close-modal" onclick="toggleFilter()">✕</button></div>
    
    <div class="filter-group">
      <label>Status Geotagging</label>
      <select id="filterStatus" onchange="applyFilters()">
        <option value="all">Semua Status</option>
        <option value="sudah">Sudah Ditandai (Memiliki Koordinat)</option>
        <option value="belum">Belum Ditandai</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Wilayah / Desa (Klungkung I)</label>
      <select id="filterAlamat" onchange="applyFilters()">
        <option value="all">Semua Wilayah</option>
        <option value="satra">Satra</option>
        <option value="kamasan">Kamasan</option>
        <option value="semarapura kauh">Semarapura Kauh</option>
        <option value="gelgel">Gelgel</option>
        <option value="tojan">Tojan</option>
        <option value="tangkas">Tangkas</option>
        <option value="semarapura klod">Semarapura Klod</option>
        <option value="semarapura klod kangin">Semarapura Klod Kangin</option>
        <option value="kampung gelgel">Kampung Gelgel</option>
      </select>
    </div>

    <button class="btn btn-submit" onclick="toggleFilter()">Terapkan & Tutup</button>
  </div>
</div>

<!-- TAMPILAN FORM -->
<div id="formView">
  <div class="form-header"><button class="nav-back" onclick="tutupForm()">←</button><h2 id="subtitleNama">Nama</h2></div>
  <div class="form-content">
    <form id="formGeo">
      <input type="hidden" id="kategori" value="HT">
      <div id="map"></div>
      <div class="map-hint">💡 Geser pin biru untuk menandai lokasi akurat.</div>
      <div class="input-group"><label>Koordinat Terpilih</label><input type="text" id="koordinat" placeholder="Belum ada koordinat" readonly required></div>
      <div class="input-group"><label>Nomor Induk Kependudukan</label><input type="text" id="nik" readonly></div>
      <button type="button" class="btn btn-gps" onclick="getGPS()">📍 Cari Otomatis Via Satelit GPS</button>
      <button type="submit" class="btn btn-submit">Simpan & Sinkronkan</button>
    </form>
  </div>
</div>

<script>
  // === JANGAN LUPA PASTIKAN LINK INI ADALAH URL WEB APP ANDA ===
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzcp57xHiOczZayb9wpQwDNkAuBiJpGPGHsfuaxpB4CxyaPzsfTN2fU9VpECskx49lE/exec"; 
  
  let db; let dataPasienLokal = []; let map, marker;

  // Logika Menghilangkan Splash Screen setelah aplikasi siap
  window.addEventListener('load', () => {
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      splash.classList.add('hidden');
      // Menghapus elemen dari memori setelah animasinya selesai
      setTimeout(() => splash.remove(), 600);
    }, 1500); // 1.5 detik waktu tampil Splash Screen
  });

  function showLoader(text) { document.getElementById('loaderText').innerText = text; document.getElementById('loaderOverlay').classList.add('active'); }
  function hideLoader() { document.getElementById('loaderOverlay').classList.remove('active'); }

  function toggleFilter() {
    const modal = document.getElementById('filterModal');
    modal.classList.toggle('active');
  }

  function resetFilters() {
    document.getElementById('searchInput').value = "";
    document.getElementById('filterStatus').value = "all";
    document.getElementById('filterAlamat').value = "all";
    applyFilters();
  }

  const request = indexedDB.open("DatabasePESONA", 1);
  request.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("dataTunda", { autoIncrement: true }); };
  request.onsuccess = (e) => { db = e.target.result; if (navigator.onLine) sinkronisasiDataTunda(); };

  window.onload = () => {
    const cachedData = localStorage.getItem('pesona_data_v9');
    if (cachedData) { dataPasienLokal = JSON.parse(cachedData); applyFilters(); }
    if (navigator.onLine) fetchDataPasien();
  };

  async function fetchDataPasien() {
    // Memastikan tidak bentrok dengan animasi Splash Screen
    setTimeout(() => showLoader("Mengambil data terbaru..."), 1500);
    try {
      const response = await fetch(GAS_URL);
      const data = await response.json();
      dataPasienLokal = data;
      localStorage.setItem('pesona_data_v9', JSON.stringify(data));
      applyFilters(); 
    } catch(e) { 
      console.log("Mode offline aktif", e);
      applyFilters(); 
    } finally { 
      hideLoader(); 
    }
  }

  function applyFilters() {
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;
    const alamatFilter = document.getElementById('filterAlamat').value;

    const isFilterActive = (keyword !== '' || statusFilter !== 'all' || alamatFilter !== 'all');
    
    const indicator = document.getElementById('filterIndicator');
    const filterBtnIcon = document.getElementById('filterBtnIcon');
    if (isFilterActive) {
      indicator.classList.add('show');
      filterBtnIcon.classList.add('active');
    } else {
      indicator.classList.remove('show');
      filterBtnIcon.classList.remove('active');
    }

    const filteredData = dataPasienLokal.filter(p => {
      const isSelesai = p.status.toLowerCase().includes("sudah");
      const matchKeyword = p.nama.toLowerCase().includes(keyword) || (p.nik && p.nik.toLowerCase().includes(keyword));
      
      let matchStatus = true;
      if (statusFilter === 'sudah') matchStatus = isSelesai;
      if (statusFilter === 'belum') matchStatus = !isSelesai;

      let matchAlamat = true;
      if (alamatFilter !== 'all') {
         const alamatDatabase = p.alamat ? p.alamat.toLowerCase() : "";
         matchAlamat = alamatDatabase.includes(alamatFilter);
      }

      return matchKeyword && matchStatus && matchAlamat;
    });

    renderList(filteredData, isFilterActive);
  }

  function renderList(data, isFilterActive) {
    const container = document.getElementById('patientList');
    container.innerHTML = "";
    
    if(data.length === 0) { 
      const emptyMessage = isFilterActive 
        ? "Tidak ada data yang cocok dengan filter." 
        : "Belum ada data pasien dari database.";
      container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted); font-weight:600; line-height: 1.5;">${emptyMessage}</div>`; 
      return; 
    }

    const svgPin = `<svg class="pin-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;

    data.forEach(p => {
      const isSelesai = p.status.toLowerCase().includes("sudah");
      const badgeClass = isSelesai ? "badge-done" : "badge-pending";
      const badgeText = isSelesai ? "Sudah Ditandai" : "Belum Ditandai";
      const alamat = p.alamat || "Alamat tidak tercatat";

      const item = document.createElement('div');
      item.className = `patient-card`;
      item.onclick = () => bukaForm(p.nama, p.nik, p.koordinat);
      item.innerHTML = `
        <div class="card-top"><div><h3 class="p-name">${p.nama}</h3><div class="p-nik">NIK: ${p.nik}</div></div></div>
        <div class="card-bottom">
          <p class="p-address">${svgPin} <span>${alamat}</span></p>
          <span class="status-badge ${badgeClass}">${badgeText}</span>
        </div>
      `;
      container.appendChild(item);
    });
  }

  function inisialisasiPeta(savedKoordinat) {
    let lat = -8.5333; let lng = 115.4000; let zoomLvl = 13;
    if (savedKoordinat && savedKoordinat.includes(",")) {
       const parts = savedKoordinat.split(',');
       lat = parseFloat(parts[0].trim()); lng = parseFloat(parts[1].trim());
       zoomLvl = 17; 
    }

    if (!map) {
      map = L.map('map').setView([lat, lng], zoomLvl);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
      marker = L.marker([lat, lng], {draggable: true}).addTo(map);
      marker.on('dragend', function(e) { const pos = marker.getLatLng(); document.getElementById('koordinat').value = `${pos.lat}, ${pos.lng}`; });
      map.on('click', function(e) { marker.setLatLng(e.latlng); document.getElementById('koordinat').value = `${e.latlng.lat}, ${e.latlng.lng}`; });
    } else {
      map.setView([lat, lng], zoomLvl);
      marker.setLatLng([lat, lng]);
    }
    setTimeout(() => { map.invalidateSize(); }, 300);
  }

  function bukaForm(nama, nik, koordinat) {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
    document.getElementById('subtitleNama').innerText = nama;
    document.getElementById('nik').value = nik;
    document.getElementById('koordinat').value = koordinat || "";
    inisialisasiPeta(koordinat);
  }

  function tutupForm() { document.getElementById('listView').style.display = 'block'; document.getElementById('formView').style.display = 'none'; }

  function getGPS() {
    if (navigator.geolocation) {
      showLoader("Mencari lokasi satelit...");
      navigator.geolocation.getCurrentPosition(
        pos => {
          hideLoader();
          const lat = pos.coords.latitude; const lng = pos.coords.longitude;
          document.getElementById('koordinat').value = `${lat}, ${lng}`;
          if(map && marker) { map.setView([lat, lng], 17); marker.setLatLng([lat, lng]); }
        },
        err => { hideLoader(); alert("Gagal ambil lokasi. Pastikan GPS HP menyala."); },
        { enableHighAccuracy: true }
      );
    }
  }

  document.getElementById('formGeo').addEventListener('submit', (e) => {
    e.preventDefault();
    const data = { kategori: document.getElementById('kategori').value, nik: document.getElementById('nik').value, koordinat: document.getElementById('koordinat').value };
    showLoader("Menyimpan & Sinkronisasi...");
    if (navigator.onLine) {
      fetch(GAS_URL, { method: "POST", body: JSON.stringify(data), mode: 'no-cors' })
        .then(() => { alert("Data berhasil masuk ke Database!"); fetchDataPasien(); tutupForm(); })
        .catch(() => { simpanOffline(data); })
        .finally(() => { hideLoader(); });
    } else { simpanOffline(data); hideLoader(); }
  });

  function simpanOffline(data) { const tx = db.transaction("dataTunda", "readwrite"); tx.objectStore("dataTunda").add(data); alert("Koneksi terputus! Data disimpan di HP."); tutupForm(); }

  function sinkronisasiDataTunda() {
    const store = db.transaction("dataTunda", "readwrite").objectStore("dataTunda");
    store.getAll().onsuccess = (e) => {
      const dataNyangkut = e.target.result;
      if (dataNyangkut.length > 0) {
        showLoader(`Menyinkronkan ${dataNyangkut.length} data tertunda...`);
        dataNyangkut.forEach((data, i) => { fetch(GAS_URL, { method: "POST", body: JSON.stringify(data), mode: 'no-cors' }).then(() => db.transaction("dataTunda", "readwrite").objectStore("dataTunda").delete(store.getAllKeys().result[i])); });
        setTimeout(() => { fetchDataPasien(); hideLoader(); }, 3000);
      }
    };
  }

  window.addEventListener('online', () => { document.getElementById('sysStatus').innerText = "SISTEM ONLINE"; document.getElementById('sysStatus').className = ""; sinkronisasiDataTunda(); });
  window.addEventListener('offline', () => { document.getElementById('sysStatus').innerText = "MODE OFFLINE"; document.getElementById('sysStatus').className = "offline"; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
